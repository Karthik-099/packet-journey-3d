# troika (3D text) builds its worker from a blob: URL; dns.google = live DNS, ipwho.is/ipapi.co = geo-IP
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://dns.google https://ipwho.is https://ipapi.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
