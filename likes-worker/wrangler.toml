name = "packet-journey-likes"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
# origins allowed to read the counter (your GitHub Pages site + local dev)
ALLOWED_ORIGINS = "https://karthik-099.github.io,http://localhost:5173,http://localhost:4173"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

# SQLite-backed Durable Objects are available on the Workers free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]
