replicaCount: 2

image:
  repository: ghcr.io/karthik-099/packet-journey-3d
  # CI overwrites this with the git SHA of the image it just built and scanned
  tag: latest
  pullPolicy: IfNotPresent

# needed only if the GHCR package is private
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # AKS app-routing add-on: webapprouting.kubernetes.azure.com ; ingress-nginx: nginx
  className: webapprouting.kubernetes.azure.com
  host: packet-journey.example.com
  annotations: {}
  tls:
    enabled: false
    secretName: packet-journey-tls

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
