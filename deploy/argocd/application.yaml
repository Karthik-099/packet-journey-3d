apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: packet-journey
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Karthik-099/packet-journey-3d.git
    targetRevision: main
    path: deploy/helm/packet-journey
    helm:
      releaseName: packet-journey
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: packet-journey
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
